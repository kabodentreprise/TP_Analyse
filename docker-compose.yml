version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: gestion_users_db
    environment:
      POSTGRES_USER: gestion_user
      POSTGRES_PASSWORD: gestion_password
      POSTGRES_DB: gestion_users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gestion_users_backend
    environment:
      DATABASE_URL: postgresql://gestion_user:gestion_password@postgres:5432/gestion_users
      SECRET_KEY: dev-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_URL: http://localhost:3000
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/api_gateway:/app
    command: sh -c "cd /app && python init_db.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # Frontend (optionnel - serveur simple)
  frontend:
    image: python:3.10-slim
    container_name: gestion_users_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: python -m http.server 3000

volumes:
  postgres_data:

networks:
  default:
    name: gestion_users_network
